plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.gateglobalfamily.app'
    compileSdk 35

    defaultConfig {
        applicationId "ai.gateglobalfamily.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
